name: Päivitä molekyylidata

# Hakee molekyylien tiedot PubChemistä ja Pyrfumesta (scripts/etl/build_molecules.py),
# tallentaa tuloksen src/data/generated/molecules.json -tiedostoon ja julkaisee sivun uudelleen.
# Ajo käsin: Actions → Päivitä molekyylidata → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/etl/**'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/etl/requirements.txt

      - run: pip install -r scripts/etl/requirements.txt

      - name: Jäsentimien testit
        run: python scripts/etl/test_parsers.py

      # Välimuisti palautetaan edellisestä ajosta ja tallennetaan aina uudella avaimella, myös
      # keskeytyneen ajon jälkeen, joten seuraava ajo jatkaa siitä mihin edellinen jäi.
      - name: Palauta välimuisti (PubChem-vastaukset)
        uses: actions/cache/restore@v4
        with:
          path: scripts/etl/.cache
          key: pubchem-${{ github.run_id }}
          restore-keys: pubchem-

      - name: Hae ja yhdistä data
        run: python scripts/etl/build_molecules.py

      - name: Tallenna välimuisti
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/etl/.cache
          key: pubchem-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Tallenna tulos repoon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/molecules.json scripts/etl/report.md scripts/etl/raw_values.md
          if git diff --cached --quiet; then
            echo "Data ei muuttunut."
          else
            git commit -m "Päivitä molekyylidata (PubChem + Pyrfume)"
            git push
          fi

  deploy:
    needs: etl
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
